<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeerTalkr</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
    <div class="app-container fade-in">
        <!-- Sidebar / Historial -->
        <div id="sidebarOverlay" class="sidebar-overlay hidden"></div>
        <aside id="sidebar" class="sidebar hidden">
            <div class="sidebar-header">
                <h2>Historial de Chats</h2>
                <button id="closeSidebarBtn" class="icon-button">✕</button>
            </div>
            <div id="recentChatsList" class="recent-chats-list"></div>
            <div class="sidebar-footer">
                <button id="clearHistoryBtn" class="danger-btn full-width">Borrar Historial</button>
            </div>
        </aside>

        <!-- Header Principal -->
        <header class="main-header">
            <button id="openSidebarBtn" class="icon-button" title="Historial">☰</button>
            <div class="header-title">
                <h1>PeerTalkr</h1>
            </div>
            <div id="statusBadge" class="status-badge connecting">
                <span class="status-dot"></span>
                <span id="statusText">Iniciando...</span>
            </div>
        </header>

        <!-- Pantalla de Conexión -->
        <main id="connectionSection" class="view-section slide-up">
            <div class="card">
                <div class="card-header">
                    <span class="card-icon">🔑</span>
                    <h2>Tu ID de Conexión</h2>
                </div>
                <div class="input-group">
                    <input type="text" id="myIdInput" readonly placeholder="Generando ID...">
                    <button id="copyIdBtn" class="primary-btn">Copiar ID</button>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <span class="card-icon">💬</span>
                    <h2>Conectar a un Peer</h2>
                </div>
                <form id="connectForm">
                    <div class="input-group">
                        <input type="text" id="remoteIdInput" placeholder="Ingresa el ID del par" required autocomplete="off">
                        <button type="submit" class="primary-btn">Conectar</button>
                    </div>
                </form>
            </div>
        </main>

        <!-- Pantalla de Chat -->
        <main id="chatSection" class="view-section hidden slide-up">
            <div class="chat-header">
                <button id="backToConnectBtn" class="icon-button">←</button>
                <div class="chat-title-group">
                    <h2 id="chatTargetTitle">--</h2>
                    <span id="chatConnectionState" class="connection-state">Sin conexión</span>
                </div>
                <div class="chat-actions">
                    <button id="reconnectBtn" class="secondary-btn hidden">Reconectar</button>
                    <button id="disconnectBtn" class="danger-btn">Desconectar</button>
                </div>
            </div>

            <div id="messageList" class="message-list"></div>

            <!-- Vista previa de archivo adjunto -->
            <div id="filePreviewContainer" class="file-preview-container hidden slide-up">
                <div class="file-info">
                    <span class="file-icon">📄</span>
                    <div class="file-details">
                        <span id="fileNameDisplay">archivo.pdf</span>
                        <span id="fileSizeDisplay">(0 MB)</span>
                    </div>
                </div>
                <button id="removeFileBtn" class="icon-button small">✕</button>
            </div>

            <!-- Formulario de Envío -->
            <form id="chatForm" class="chat-form">
                <input type="file" id="fileInput" class="hidden">
                <button type="button" id="attachBtn" class="icon-button" title="Adjuntar archivo">📎</button>
                <input type="text" id="messageInput" placeholder="Escribe un mensaje en PeerTalkr..." autocomplete="off">
                <button type="submit" class="primary-btn">Enviar</button>
            </form>
        </main>

        <!-- Modal Custom (Reemplaza alert/confirm) -->
        <div id="customModal" class="modal-overlay hidden">
            <div class="modal-card">
                <div class="modal-header">
                    <span id="modalIcon" class="modal-icon">ℹ️</span>
                    <h3 id="modalTitle">Aviso</h3>
                </div>
                <p id="modalMessage" class="modal-body">Mensaje del sistema</p>
                <div class="modal-actions">
                    <button id="modalCancelBtn" class="secondary-btn hidden">Cancelar</button>
                    <button id="modalConfirmBtn" class="primary-btn">Aceptar</button>
                </div>
            </div>
        </div>

        <!-- Pie de página -->
        <footer class="app-footer">
            <span>Fefin 2026 | peertalkr.v6.navy</span>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
